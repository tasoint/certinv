# certinv 設定ファイルのサンプル
# config.yaml にコピーして編集してください（config.yaml は .gitignore 済み）

# 処理対象の apex ドメイン。ここに登録したものだけが処理されます。
# eTLD+1 である必要があります（例: example.com は可、www.example.com は不可）。
# example.comのままcrt.name discoveryを有効にすると大量の無関係なホストが見つかるため、
# 必ず自分が所有・管理する実際のドメインに書き換えてください。
apexes:
  - example.com

# Certificate Transparency には現れないホストの手動登録。
# ワイルドカード証明書配下のホスト、443以外のポート、内部CAのホストなど。
manual_hosts:
  - hostname: mail.example.com
    port: 993
  - hostname: vpn.example.com
    port: 443
  - hostname: lb01.example.com
    port: 8443

discovery:
  sources: [crtname, manual]
  crtname:
    endpoint: https://crt.name/v1/search
  # DNSゾーンファイルから A / AAAA / CNAME のホスト名を取り込む場合:
  # sources: [crtname, manual, zone]
  # zone:
  #   # UIから追加できるzone fileをこのディレクトリ配下に制限します。
  #   allowed_dir: ./zones
  #   files:
  #     - ./example.com.zone

probe:
  concurrency: 5
  connect_timeout: 5s
  handshake_timeout: 5s
  # HTTPS status check after the TLS probe
  http_check: false
  # DNS解決に連続して失敗した場合に retired 扱いにするまでの日数
  retire_after_days: 30

# 閾値は残存日数ではなく残存率で判定します。
#   threshold = max(floor_days, lifetime_days * ratio)
# 有効期間が47日に短縮されても機能させるための設計です。
thresholds:
  warn:
    ratio: 0.25
    floor_days: 3
  alert:
    ratio: 0.10
    floor_days: 1

storage:
  driver: sqlite
  dsn: ./certinv.db

# serve モードのみ有効
schedule:
  interval: 6h

# シークレットは環境変数経由でのみ指定できます。
# 通知を有効化する場合は以下をコメント解除してください。
notifiers: []
# notifiers:
#   - type: slack
#     webhook_url_env: SLACK_WEBHOOK_URL
#     events: [alert, expired, misconfigured]
#   - type: webhook
#     url: https://example.com/hooks/certinv
#     events: [warn, alert, renewed, expired]

# serve モードのみ有効
exporter:
  listen: :9101
  # 両方空ならBasic認証は無効です。
  # 外部公開する場合はTLS終端・アクセス制御済みのリバースプロキシ配下に置いてください。
  basic_auth:
    username: ""
    password: ""
